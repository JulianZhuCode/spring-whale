version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      spring-dependencies:
        patterns:
          - "org.springframework*"
      flyway:
        patterns:
          - "org.flywaydb*"
    ignore:
      - dependency-name: "org.flywaydb:flyway-database-postgresql"
        versions: ["13.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
