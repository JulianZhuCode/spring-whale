<!DOCTYPE html>
<html layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{rbac.users.title}">Users</title>
</head>

<body>

<main layout:fragment="content">
    <th:block th:replace="~{admin/fragments/data-table :: table(
        title=#{rbac.users.title},
        description=#{rbac.users.description},
        createUrl='#',
        createModal='user-modal',
        createPermission='rbac:user:create',
        items=${users},
        emptyMessage=#{rbac.users.empty},
        baseUrl='/admin/rbac/users',
        page=${page},
        colspan=7,
        headers=~{::#user-headers},
        rows=~{::#user-row},
        filter=~{::#user-filter}
    )}">
        <th:block id="user-filter">
            <div class="row g-2" data-table-search="/admin/rbac/users">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input class="form-control" data-search-field="keyword"
                               th:placeholder="#{rbac.users.search_placeholder}"
                               th:value="${keyword}" type="text">
                        <button class="btn btn-outline-secondary" data-search-clear style="display:none"
                                type="button">
                            <i class="bi bi-x-lg"></i>
                        </button>
                        <button class="btn btn-primary" data-search-submit type="button">
                            <i class="bi bi-search me-1"></i><span th:text="#{table.search}">Search</span>
                        </button>
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" data-search-field="status">
                        <option value="" th:text="#{rbac.users.all_status}">All Status</option>
                        <option th:selected="${selectedStatus != null and selectedStatus == '1'}" value="1" th:text="#{status.active}">Active</option>
                        <option th:selected="${selectedStatus != null and selectedStatus == '0'}" value="0" th:text="#{status.disabled}">Disabled</option>
                    </select>
                </div>
            </div>
        </th:block>
        <th:block id="user-headers">
            <th th:text="#{rbac.users.username}">Username</th>
            <th th:text="#{rbac.users.real_name}">Real Name</th>
            <th th:text="#{rbac.users.email}">Email</th>
            <th th:text="#{rbac.users.phone}">Phone</th>
            <th th:text="#{rbac.users.group}">Group</th>
            <th th:text="#{rbac.users.status}">Status</th>
            <th th:text="#{rbac.users.actions}">Actions</th>
        </th:block>
        <th:block id="user-row">
            <td th:text="${item.username}">admin</td>
            <td th:text="${item.realName}">Admin</td>
            <td th:text="${item.email}">admin@example.com</td>
            <td th:text="${item.phone}">13800138000</td>
            <td th:text="${item.groupName} ?: '-'">Root Group</td>
            <td>
                <span class="badge bg-success" th:if="${item.status == 1}" th:text="#{status.active}">Active</span>
                <span class="badge bg-danger" th:if="${item.status == 0}" th:text="#{status.disabled}">Disabled</span>
            </td>
            <td>
                <div class="d-flex gap-1">
                    <button class="btn btn-outline-primary btn-sm"
                            data-modal="user-modal" th:attr="data-edit-id=${item.id}"
                            th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'rbac:user:update')}"
                            th:text="#{action.edit}">Edit
                    </button>
                    <button class="btn btn-outline-success btn-sm"
                            data-role-modal="role-assign-modal"
                            th:data-user-id="${item.id}"
                            th:data-user-name="${item.username}"
                            th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'rbac:user:update')}">
                        <i class="bi bi-person-check me-1"></i><span th:text="#{rbac.users.assign_roles}">Assign Roles</span>
                    </button>
                    <button class="btn btn-outline-danger btn-sm"
                            data-delete-api="/api/rbac/users"
                            th:attr="data-delete-id=${item.id},data-delete-name=${item.username}"
                            th:if="${#sets.contains(userAuthorities, '*') or #sets.contains(userAuthorities, 'rbac:user:delete')}"
                            th:text="#{action.delete}">Delete
                    </button>
                </div>
            </td>
        </th:block>
    </th:block>

<!-- User Modal -->
    <div class="modal fade" id="user-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{rbac.users.create}">Create User</h5>
                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <form class="dict-modal-form" data-api-base="/api/rbac/users" data-group-api="/api/rbac/groups?page=0&size=1000">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="user-username"
                                   th:text="#{rbac.users.username}">Username</label>
                            <input class="form-control" id="user-username" name="username" required type="text">
                            <div class="invalid-feedback" data-field="username"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="user-password"
                                   th:text="#{rbac.users.password}">Password</label>
                            <input class="form-control" id="user-password" name="password" type="password">
                            <div class="invalid-feedback" data-field="password"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="user-realName" th:text="#{rbac.users.real_name}">Real
                                Name</label>
                            <input class="form-control" id="user-realName" name="realName" type="text">
                            <div class="invalid-feedback" data-field="realName"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="user-email" th:text="#{rbac.users.email}">Email</label>
                            <input class="form-control" id="user-email" name="email" type="email">
                            <div class="invalid-feedback" data-field="email"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="user-phone" th:text="#{rbac.users.phone}">Phone</label>
                            <input class="form-control" id="user-phone" name="phone" type="text">
                            <div class="invalid-feedback" data-field="phone"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="user-groupId" th:text="#{rbac.users.group}">Group</label>
                            <select class="form-select" id="user-groupId" name="groupId" data-int-field>
                                <option th:text="#{rbac.users.select_group}" value="">-- Select --</option>
                            </select>
                            <div class="invalid-feedback" data-field="groupId"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="user-status" th:text="#{rbac.users.status}">Status</label>
                            <select class="form-select" id="user-status" name="status" data-int-field>
                                <option th:text="#{status.active}" value="1">Active</option>
                                <option th:text="#{status.disabled}" value="0">Disabled</option>
                            </select>
                            <div class="invalid-feedback" data-field="status"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{action.cancel}"
                                type="button">Cancel
                        </button>
                        <button class="btn btn-primary modal-submit" th:text="#{action.save}" type="button">Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Role Assignment Modal -->
    <div class="modal fade" id="role-assign-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Assign Roles — <span id="role-assign-user-name"></span></h5>
                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <div class="modal-body" style="max-height:60vh;overflow-y:auto">
                    <div id="role-assign-container">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 text-muted">Loading roles...</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:inline="javascript">
(function() {
    var currentUserId = null;

    function showToast(message, type) {
        var toast = document.getElementById('dict-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'dict-toast';
            toast.className = 'modal-toast';
            document.body.appendChild(toast);
        }
        toast.className = 'modal-toast ' + (type || 'success');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    // ==================== Role assignment modal ====================

    document.addEventListener('click', function(e) {
        var btn = e.target.closest('[data-role-modal]');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        try {
            var userId = btn.getAttribute('data-user-id');
            var userName = btn.getAttribute('data-user-name');
            if (!userId) {
                console.error('Missing data-user-id on role button');
                return;
            }
            currentUserId = userId;

            document.getElementById('role-assign-user-name').textContent = userName;
            var container = document.getElementById('role-assign-container');
            container.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Loading roles...</p></div>';

            var roleModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('role-assign-modal'));
            roleModal.show();

            Promise.all([
                fetch('/api/rbac/roles?page=0&size=1000').then(function(r) { return r.json(); }),
                fetch('/api/rbac/users/' + userId + '/roles').then(function(r) { return r.json(); })
            ]).then(function(results) {
                var rolePage = results[0];
                var roleList = rolePage.content || rolePage.data || rolePage || [];
                var checkedIds = results[1] || [];
                container.innerHTML = '';

                if (roleList.length === 0) {
                    container.innerHTML = '<div class="alert alert-warning">No roles available</div>';
                    return;
                }

                roleList.forEach(function(role) {
                    var item = document.createElement('div');
                    item.className = 'form-check py-1 px-2 rounded';

                    var checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'form-check-input role-assign-checkbox';
                    checkbox.setAttribute('data-role-id', role.id);
                    checkbox.id = 'role-cb-' + role.id;
                    if (checkedIds.indexOf(role.id) !== -1) {
                        checkbox.checked = true;
                    }

                    var label = document.createElement('label');
                    label.className = 'form-check-label';
                    label.setAttribute('for', 'role-cb-' + role.id);
                    label.style.fontSize = '0.9rem';
                    label.textContent = role.name;

                    var desc = document.createElement('small');
                    desc.className = 'text-muted ms-2';
                    desc.textContent = role.description || '';
                    desc.style.fontSize = '0.75rem';

                    label.appendChild(desc);
                    item.appendChild(checkbox);
                    item.appendChild(label);
                    container.appendChild(item);
                });

                container.addEventListener('change', function(e) {
                    if (!e.target.classList.contains('role-assign-checkbox')) return;
                    var roleId = parseInt(e.target.getAttribute('data-role-id'));
                    var checked = e.target.checked;

                    var url = '/api/rbac/users/' + currentUserId + '/roles';
                    var method = checked ? 'POST' : 'DELETE';
                    fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify([roleId])
                    }).then(function(r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    }).then(function() {
                        showToast(checked ? 'Role assigned successfully' : 'Role removed successfully', 'success');
                    }).catch(function() {
                        showToast('Operation failed', 'error');
                        e.target.checked = !checked;
                    });
                });
            }).catch(function(err) {
                container.innerHTML = '<div class="alert alert-danger">Failed to load roles: ' + (err.message || 'Unknown error') + '</div>';
            });
        } catch(e) {
            console.error('Role assign modal error:', e);
            showToast('Failed to open role assignment', 'error');
        }
    });
})();
</script>

</body>
</html>
