<!DOCTYPE html>
<html layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{task.title}">Batch Tasks</title>
</head>

<body>

<main layout:fragment="content">
    <th:block th:replace="~{admin/fragments/data-table :: table(
        title=#{task.title},
        description=#{task.description},
        createUrl='#',
        createModal='task-create-modal',
        createPermission='task:create',
        items=${tasks},
        emptyMessage=#{task.empty},
        baseUrl='/admin/task/batch',
        page=${page},
        colspan=9,
        headers=~{::#task-headers},
        rows=~{::#task-row},
        filter=~{::#task-filter}
    )}">

        <th:block id="task-filter">
            <div class="row g-2" data-table-search="/admin/task/batch">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input class="form-control" data-search-field="taskType"
                               th:placeholder="#{task.search_placeholder}"
                               th:value="${taskType}" type="text">
                        <button class="btn btn-outline-secondary" data-search-clear style="display:none"
                                type="button">
                            <i class="bi bi-x-lg"></i>
                        </button>
                        <button class="btn btn-primary" data-search-submit type="button">
                            <i class="bi bi-search me-1"></i><span th:text="#{table.search}">Search</span>
                        </button>
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" data-search-field="status">
                        <option value="" th:text="#{task.all_status}">All Status</option>
                        <option th:selected="${selectedStatus == 'PENDING'}" value="PENDING" th:text="#{task.progress_pending}">Pending</option>
                        <option th:selected="${selectedStatus == 'RUNNING'}" value="RUNNING" th:text="#{task.progress_running}">Running</option>
                        <option th:selected="${selectedStatus == 'PAUSED'}" value="PAUSED" th:text="#{task.progress_paused}">Paused</option>
                        <option th:selected="${selectedStatus == 'COMPLETED'}" value="COMPLETED" th:text="#{task.progress_completed}">Completed</option>
                        <option th:selected="${selectedStatus == 'FAILED'}" value="FAILED" th:text="#{task.progress_failed}">Failed</option>
                        <option th:selected="${selectedStatus == 'CANCELLED'}" value="CANCELLED" th:text="#{task.progress_cancelled}">Cancelled</option>
                    </select>
                </div>
            </div>
        </th:block>

        <th:block id="task-headers">
            <th th:text="#{task.type}">Type</th>
            <th th:text="#{task.status}">Status</th>
            <th th:text="#{task.progress}">Progress</th>
            <th th:text="#{task.total}">Total</th>
            <th th:text="#{task.success}">/ <span class="text-success">Success</span></th>
            <th th:text="#{task.fail}">/ <span class="text-danger">Failed</span></th>
            <th th:text="#{task.start_time}">Start / End</th>
            <th th:text="#{task.actions}">Actions</th>
        </th:block>

        <th:block id="task-row">
            <td><code th:text="${item.taskType}">WORD_AUDIO</code></td>
            <td>
                <span class="badge" th:classappend="${item.status.name() == 'RUNNING'} ? 'bg-primary' :
                                                     (${item.status.name() == 'COMPLETED'} ? 'bg-success' :
                                                     (${item.status.name() == 'FAILED'} ? 'bg-danger' :
                                                     (${item.status.name() == 'PAUSED'} ? 'bg-warning text-dark' :
                                                     (${item.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-light text-dark'))))"
                      th:text="${item.statusLabel}">Running</span>
            </td>
            <td style="min-width: 200px;">
                <div class="progress" style="height: 20px;" title="Progress">
                    <div class="progress-bar progress-bar-striped progress-bar-animated"
                         th:classappend="${item.status.name() == 'COMPLETED'} ? 'bg-success' :
                                          (${item.status.name() == 'FAILED'} ? 'bg-danger' :
                                          (${item.status.name() == 'PAUSED'} ? 'bg-warning text-dark' : 'bg-primary'))"
                         th:style="'width:' + ${item.progress} + '%'"
                         th:text="${item.progress} + '%'">0%</div>
                </div>
                <small class="text-muted" th:if="${item.formattedRemainingTime != null and !item.formattedRemainingTime.isEmpty()}"
                       th:text="#{task.detail_remaining_prefix(${item.formattedRemainingTime})}">Estimated remaining: 5m30s</small>
            </td>
            <td th:text="${item.totalCount}">100</td>
            <td class="text-success" th:text="${item.successCount}">95</td>
            <td class="text-danger" th:text="${item.failCount}">2</td>
            <td>
                <small th:text="${item.startTime != null} ? ${#temporals.format(item.startTime.atZone(T(java.time.ZoneId).systemDefault()).toLocalDateTime(), 'MM-dd HH:mm:ss')} : '-'">07-29 10:00:00</small>
                <br/>
                <small class="text-muted" th:text="${item.endTime != null} ? ${#temporals.format(item.endTime.atZone(T(java.time.ZoneId).systemDefault()).toLocalDateTime(), 'MM-dd HH:mm:ss')} : '-'">-</small>
            </td>
            <td>
                <div class="btn-group" role="group">
                    <button class="btn btn-sm btn-success" th:if="${item.status.name() == 'PENDING'}"
                            th:data-api="|/api/tasks/${item.id}/start|"
                            th:data-api-method="POST"
                            th:text="#{task.start}">Start</button>
                    <button class="btn btn-sm btn-warning" th:if="${item.status.name() == 'RUNNING'}"
                            th:data-api="|/api/tasks/${item.id}/pause|"
                            th:data-api-method="POST"
                            th:text="#{task.pause}">Pause</button>
                    <button class="btn btn-sm btn-primary" th:if="${item.status.name() == 'PAUSED'}"
                            th:data-api="|/api/tasks/${item.id}/resume|"
                            th:data-api-method="POST"
                            th:text="#{task.resume}">Resume</button>
                    <button class="btn btn-sm btn-outline-danger" th:if="${item.status.name() == 'RUNNING' or item.status.name() == 'PAUSED' or item.status.name() == 'PENDING'}"
                            th:data-api="|/api/tasks/${item.id}/cancel|"
                            th:data-api-method="POST"
                            th:data-confirm="#{task.confirm_cancel}"
                            th:text="#{task.cancel}">Cancel</button>
                    <button class="btn btn-sm btn-warning"
                            th:if="${(item.status.name() == 'COMPLETED' or item.status.name() == 'CANCELLED' or item.status.name() == 'FAILED') and item.failCount != null and item.failCount > 0}"
                            th:data-retry-api="|/api/tasks/${item.id}/retry-failed|"
                            th:attr="data-retry-confirm=#{task.retry_confirm(${item.failCount})}"
                            th:text="#{task.retry_failed}">Retry Failed</button>
                    <button class="btn btn-sm btn-outline-dark"
                            th:if="${item.status.name() == 'COMPLETED' or item.status.name() == 'CANCELLED' or item.status.name() == 'FAILED'}"
                            th:data-task-delete="|/api/tasks/${item.id}|"
                            th:data-task-delete-confirm="#{task.confirm_delete}"
                            th:text="#{task.delete}">Delete</button>
                    <button class="btn btn-sm btn-info"
                            th:data-api-get="|/api/tasks/${item.id}|"
                            th:text="#{task.view}">View</button>
                </div>
            </td>
        </th:block>
    </th:block>

    <!-- Create Task Modal -->
    <div class="modal fade" id="task-create-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{task.create_title}">Create Batch Task</h5>
                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <form id="task-create-form" data-api-base="/api/tasks">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" th:text="#{task.type}">Task Type</label>
                            <input class="form-control" name="taskType" required type="text"
                                   th:placeholder="#{task.type_select}">
                            <div class="invalid-feedback" data-field="taskType"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{task.params_json}">Parameters (JSON)</label>
                            <textarea class="form-control" name="params" rows="4"
                                      placeholder='{"voice":"ja-JP-NanamiNeural"}'></textarea>
                            <div class="form-text">Optional JSON object passed to the task handler</div>
                            <div class="invalid-feedback" data-field="params"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{action.cancel}"
                                type="button">Cancel
                        </button>
                        <button class="btn btn-primary modal-submit" th:text="#{task.create_button}" type="button">
                            Create & Start
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            var i18n = {
                operationSuccess: /*[[#{task.operation_success}]]*/ 'Operation succeeded',
                operationFailed: /*[[#{task.operation_failed}]]*/ 'Operation failed',
                detailFetchFailed: /*[[#{task.detail_fetch_failed}]]*/ 'Failed to fetch task details',
                deleteConfirm: /*[[#{task.delete_confirm}]]*/ 'Are you sure you want to delete this task?',
                deleteTitle: /*[[#{task.delete_title}]]*/ 'Delete Confirmation',
                deleteOk: /*[[#{task.delete_ok}]]*/ 'Confirm Delete',
                deleteSuccess: /*[[#{task.delete_success}]]*/ 'Deleted successfully',
                deleteFailed: /*[[#{task.delete_failed}]]*/ 'Delete failed',
                retryConfirm: /*[[#{task.retry_confirm}]]*/ 'Are you sure you want to retry {0} failed items?',
                retryConfirmFull: /*[[#{task.retry_confirm_full}]]*/ 'Are you sure you want to retry {0} failed items?',
                retryTitle: /*[[#{task.retry_title}]]*/ 'Retry Failed Items',
                retryOk: /*[[#{task.retry_ok}]]*/ 'Start Retry',
                retrySuccess: /*[[#{task.retry_success}]]*/ 'Failed items reset and retry started',
                retryFailedMsg: /*[[#{task.retry_failed_msg}]]*/ 'Retry failed',
                createSuccess: /*[[#{task.create_success}]]*/ 'Task created and started',
                createFailed: /*[[#{task.create_failed}]]*/ 'Failed to create task',
                typeRequired: /*[[#{task.type_required}]]*/ 'Task Type is required',
                paramsInvalidJson: /*[[#{task.params_invalid_json}]]*/ 'Parameters must be valid JSON',
                startFailed: /*[[#{task.start_failed}]]*/ 'Start failed',
                detailStatus: /*[[#{task.detail_status}]]*/ 'Status',
                detailProgress: /*[[#{task.detail_progress}]]*/ 'Progress',
                detailRemainingPrefix: /*[[#{task.detail_remaining_prefix}]]*/ 'Estimated remaining',
                detailStartTime: /*[[#{task.start_time}]]*/ 'Start Time',
                detailEndTime: /*[[#{task.detail_end_time}]]*/ 'End Time',
                detailCreateTime: /*[[#{task.detail_create_time}]]*/ 'Create Time',
                detailErrorMessage: /*[[#{task.detail_error_message}]]*/ 'Error Message',
                detailTotalSuccessFailSkip: /*[[#{task.detail_total_success_fail_skip}]]*/ 'Total / Success / Failed / Skipped',
                detailParams: /*[[#{task.detail_params}]]*/ 'Parameters (params)',
                close: /*[[#{task.close}]]*/ 'Close',
                failedItems: /*[[#{task.failed_items}]]*/ 'Failed Items',
                itemKey: /*[[#{task.item_key}]]*/ 'Item Key',
                retryCount: /*[[#{task.retry_count}]]*/ 'Retry Count',
                retryFailed: /*[[#{task.retry_failed}]]*/ 'Retry Failed'
            };

            function formatMsg(template, val) {
                return template.replace('{0}', val);
            }

            // ========== Action buttons (Start / Pause / Resume / Cancel) ==========
            document.addEventListener('click', async function (e) {
                var btn = e.target.closest('[data-api]');
                if (!btn) return;
                e.preventDefault();

                var confirmMsg = btn.getAttribute('data-confirm');
                if (confirmMsg) {
                    var ok = await showConfirm({message: confirmMsg, type: 'warning'});
                    if (!ok) return;
                }

                var url = btn.getAttribute('data-api');
                var method = btn.getAttribute('data-api-method') || 'POST';

                var origHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

                fetch(url, {method: method})
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (d && d.code && d.code !== '200') {
                            throw new Error(d.message || 'Operation failed');
                        }
                        var task = (d && d.data) ? d.data : d;
                        var statusText = task ? (task.statusLabel || task.status) : '';
                        showToast(formatMsg(i18n.operationSuccess, statusText), 'success');
                        setTimeout(function () { location.reload(); }, 800);
                    })
                    .catch(function (err) {
                        btn.disabled = false;
                        btn.innerHTML = origHtml;
                        showPageError(err.message || i18n.operationFailed, 'error');
                    });
            });

            // ========== View button (task detail modal) ==========
            document.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-api-get]');
                if (!btn) return;
                e.preventDefault();

                var url = btn.getAttribute('data-api-get');
                fetch(url)
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        var task = (d && d.data) ? d.data : d;
                        if (!task) throw new Error('Task not found');
                        showTaskDetailModal(task);
                    })
                    .catch(function (err) {
                        showPageError(err.message || i18n.detailFetchFailed, 'error');
                    });
            });

            // ========== Delete button ==========
            document.addEventListener('click', async function (e) {
                var btn = e.target.closest('[data-task-delete]');
                if (!btn) return;
                e.preventDefault();

                var confirmMsg = btn.getAttribute('data-task-delete-confirm') || i18n.deleteConfirm;
                var ok = await showConfirm({
                    message: confirmMsg,
                    type: 'danger',
                    title: i18n.deleteTitle,
                    okText: i18n.deleteOk
                });
                if (!ok) return;

                var url = btn.getAttribute('data-task-delete');
                var origHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

                fetch(url, {method: 'DELETE'})
                    .then(function (r) {
                        if (r.status === 200 || r.status === 204) {
                            showToast(i18n.deleteSuccess, 'success');
                            setTimeout(function () { location.reload(); }, 600);
                        } else {
                            return r.json().then(function (d) {
                                throw new Error((d && d.message) || i18n.deleteFailed);
                            });
                        }
                    })
                    .catch(function (err) {
                        btn.disabled = false;
                        btn.innerHTML = origHtml;
                        showPageError(err.message || i18n.deleteFailed, 'error');
                    });
            });

            // ========== Retry Failed button ==========
            document.addEventListener('click', async function (e) {
                var btn = e.target.closest('[data-retry-api]');
                if (!btn) return;
                e.preventDefault();

                var confirmMsg = btn.getAttribute('data-retry-confirm') || formatMsg(i18n.retryConfirm, '?');
                var ok = await showConfirm({
                    message: confirmMsg,
                    type: 'warning',
                    title: i18n.retryTitle,
                    okText: i18n.retryOk
                });
                if (!ok) return;

                var url = btn.getAttribute('data-retry-api');
                var origHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

                fetch(url, {method: 'POST'})
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (d && d.code && d.code !== '200') throw new Error(d.message || i18n.retryFailedMsg);
                        showToast(i18n.retrySuccess, 'success');
                        setTimeout(function () { location.reload(); }, 800);
                    })
                    .catch(function (err) {
                        btn.disabled = false;
                        btn.innerHTML = origHtml;
                        showPageError(err.message || i18n.retryFailedMsg, 'error');
                    });
            });

            function showTaskDetailModal(task) {
                var html =
                    '<div class="modal fade" id="task-detail-modal" tabindex="-1">' +
                    '  <div class="modal-dialog modal-lg">' +
                    '    <div class="modal-content">' +
                    '      <div class="modal-header">' +
                    '        <h5 class="modal-title">Task #' + escapeHtml(String(task.id)) + ' - ' + escapeHtml(task.taskType || '') + '</h5>' +
                    '        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>' +
                    '      </div>' +
                    '      <div class="modal-body" id="task-detail-body">' +
                    '        <table class="table table-sm table-borderless">' +
                    '          <tr><th style="width:160px">' + escapeHtml(i18n.detailStatus) + '</th><td><span class="badge">' + escapeHtml(task.statusLabel || task.status || '') + '</span></td></tr>' +
                    '          <tr><th>' + escapeHtml(i18n.detailProgress) + '</th><td>' +
                                 (task.progress != null ? task.progress : 0) + '%' +
                                 ' <div class="progress mt-1"><div class="progress-bar" style="width:' + (task.progress || 0) + '%"></div></div>' +
                                 (task.estimatedRemainingSeconds != null && task.estimatedRemainingSeconds > 0
                                     ? '<small class="text-muted mt-1 d-block">' + escapeHtml(formatMsg(i18n.detailRemainingPrefix, String(task.estimatedRemainingSeconds))) + '</small>' : '') +
                                 '</td></tr>' +
                    '          <tr><th>' + escapeHtml(i18n.detailTotalSuccessFailSkip) + '</th><td>' +
                                 (task.totalCount != null ? task.totalCount : 0) + ' / ' +
                                 '<span class="text-success">' + (task.successCount != null ? task.successCount : 0) + '</span> / ' +
                                 '<span class="text-danger">' + (task.failCount != null ? task.failCount : 0) + '</span> / ' +
                                 (task.skippedCount != null ? task.skippedCount : 0) +
                                 '</td></tr>' +
                    '          <tr><th>' + escapeHtml(i18n.detailStartTime) + '</th><td>' + escapeHtml(task.startTime ? String(task.startTime) : '-') + '</td></tr>' +
                    '          <tr><th>' + escapeHtml(i18n.detailEndTime) + '</th><td>' + escapeHtml(task.endTime ? String(task.endTime) : '-') + '</td></tr>' +
                    '          <tr><th>' + escapeHtml(i18n.detailCreateTime) + '</th><td>' + escapeHtml(task.createTime ? String(task.createTime) : '-') + '</td></tr>' +
                    (task.errorMessage ? ('<tr><th>' + escapeHtml(i18n.detailErrorMessage) + '</th><td class="text-danger"><pre class="mb-0 small">' + escapeHtml(String(task.errorMessage)) + '</pre></td></tr>') : '') +
                    (task.params ? ('<tr><th>' + escapeHtml(i18n.detailParams) + '</th><td><pre class="mb-0 small bg-light p-2 rounded">' + escapeHtml(String(task.params)) + '</pre></td></tr>') : '') +
                    '        </table>' +
                    '        <div id="task-failed-items-container"></div>' +
                    '      </div>' +
                    '      <div class="modal-footer">' +
                    ((task.failCount != null && task.failCount > 0 && (task.status == 'COMPLETED' || task.status == 'CANCELLED' || task.status == 'FAILED'))
                        ? '<button type="button" class="btn btn-warning" id="task-retry-failed-btn">' + escapeHtml(i18n.retryFailed) + '</button>' : '') +
                    '        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">' + escapeHtml(i18n.close) + '</button>' +
                    '      </div>' +
                    '    </div>' +
                    '  </div>' +
                    '</div>';
                var old = document.getElementById('task-detail-modal');
                if (old) old.remove();
                document.body.insertAdjacentHTML('beforeend', html);
                var modalEl = document.getElementById('task-detail-modal');
                var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                modal.show();

                if (task.failCount != null && task.failCount > 0) {
                    fetch('/api/tasks/' + task.id + '/failed-items')
                        .then(function(r) { return r.json(); })
                        .then(function(items) {
                            var container = document.getElementById('task-failed-items-container');
                            if (!container || !items || items.length === 0) return;
                            var rows = items.map(function(item) {
                                return '<tr>' +
                                    '<td class="text-danger">' + escapeHtml(item.itemKey || '') + '</td>' +
                                    '<td>' + escapeHtml(item.errorMessage || '-') + '</td>' +
                                    '<td>' + (item.retryCount || 0) + '</td>' +
                                '</tr>';
                            }).join('');
                            container.innerHTML =
                                '<h6 class="mt-2">' + escapeHtml(formatMsg(i18n.failedItems, items.length)) + '</h6>' +
                                '<table class="table table-sm table-bordered">' +
                                '<thead><tr><th>' + escapeHtml(i18n.itemKey) + '</th><th>' + escapeHtml(i18n.detailErrorMessage) + '</th><th>' + escapeHtml(i18n.retryCount) + '</th></tr></thead>' +
                                '<tbody>' + rows + '</tbody>' +
                                '</table>';
                        })
                        .catch(function(err) {
                            console.error('Failed to load failed items:', err);
                        });
                }

                var retryBtn = document.getElementById('task-retry-failed-btn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', async function() {
                        var ok = await showConfirm({
                            message: formatMsg(i18n.retryConfirmFull, task.failCount || 0),
                            type: 'warning',
                            title: i18n.retryTitle,
                            okText: i18n.retryOk
                        });
                        if (!ok) return;
                        retryBtn.disabled = true;
                        retryBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
                        fetch('/api/tasks/' + task.id + '/retry-failed', {method: 'POST'})
                            .then(function(r) { return r.json(); })
                            .then(function(d) {
                                if (d && d.code && d.code !== '200') throw new Error(d.message || i18n.retryFailedMsg);
                                showToast(i18n.retrySuccess, 'success');
                                setTimeout(function() { location.reload(); }, 800);
                            })
                            .catch(function(err) {
                                retryBtn.disabled = false;
                                retryBtn.innerHTML = i18n.retryFailed;
                                showPageError(err.message || i18n.retryFailedMsg, 'error');
                            });
                    });
                }
            }

            function escapeHtml(s) {
                if (s == null) return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            // ========== Create Task Modal submit ==========
            var createBtn = document.querySelector('#task-create-modal .modal-submit');
            if (createBtn) {
                createBtn.addEventListener('click', function () {
                    var form = document.getElementById('task-create-form');
                    if (!form) return;
                    var taskTypeInput = form.querySelector('input[name="taskType"]');
                    var paramsInput = form.querySelector('textarea[name="params"]');

                    var taskType = taskTypeInput ? taskTypeInput.value.trim() : '';
                    if (!taskType) {
                        form.querySelectorAll('.invalid-feedback[data-field="taskType"]').forEach(function (el) {
                            el.textContent = i18n.typeRequired;
                        });
                        return;
                    }

                    var params = {};
                    if (paramsInput && paramsInput.value.trim()) {
                        try {
                            params = JSON.parse(paramsInput.value.trim());
                        } catch (e) {
                            form.querySelectorAll('.invalid-feedback[data-field="params"]').forEach(function (el) {
                                el.textContent = formatMsg(i18n.paramsInvalidJson, e.message);
                            });
                            return;
                        }
                    }
                    form.querySelectorAll('.invalid-feedback').forEach(function (el) { el.textContent = ''; });

                    var origHtml = createBtn.innerHTML;
                    createBtn.disabled = true;
                    createBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

                    fetch('/api/tasks', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({taskType: taskType, params: params})
                    })
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                            if (d && d.code && d.code !== '200') {
                                throw new Error(d.message || i18n.createFailed);
                            }
                            var task = (d && d.data) ? d.data : d;
                            if (task && task.status && (task.status === 'PENDING' || (task.status.name && task.status.name() === 'PENDING'))) {
                                return fetch('/api/tasks/' + task.id + '/start', {method: 'POST'})
                                    .then(function (r2) { return r2.json(); })
                                    .then(function (d2) {
                                        if (d2 && d2.code && d2.code !== '200') throw new Error(d2.message || i18n.startFailed);
                                        return (d2 && d2.data) ? d2.data : d2;
                                    });
                            }
                            return task;
                        })
                        .then(function (finalTask) {
                            showToast(formatMsg(i18n.createSuccess, finalTask.id), 'success');
                            var modalEl = document.getElementById('task-create-modal');
                            if (modalEl) bootstrap.Modal.getInstance(modalEl)?.hide();
                            setTimeout(function () { location.reload(); }, 800);
                        })
                        .catch(function (err) {
                            createBtn.disabled = false;
                            createBtn.innerHTML = origHtml;
                            showPageError(err.message || i18n.createFailed, 'error');
                        });
                });
            }
        })();
    </script>
</main>

</body>
</html>
