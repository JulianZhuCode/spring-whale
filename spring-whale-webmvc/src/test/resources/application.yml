spring:
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 0s
    fallback-to-system-locale: false
  whale:
    web-mvc:
      security:
        jwt-secret: "test-secret-key-for-unit-testing-purposes-only-at-least-32-bytes"
        permit-all-urls:
          - "/**"
        csrf-enabled: false